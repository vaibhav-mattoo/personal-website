name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by vaibhav-mattoo/notes' notify-deploy workflow on every push to
  # its master — a content-only change with no code change here still
  # needs a rebuild, since notes/topics content is baked into the Docker
  # image at build time (deploy/update.sh runs deploy/sync-notes.sh before
  # `docker compose ... --build`).
  repository_dispatch:
    types: [notes-updated]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            sudo /opt/personal-website/deploy/update.sh
