name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Read-only deploy key for vaibhav-mattoo/notes (private) — see
      # docs/notes-repo.md. deploy/sync-notes.sh (predev/precheck/prebuild
      # hooks in package.json) clones it over SSH.
      - name: Load notes repo deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NOTES_DEPLOY_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Build site (includes Pagefind index)
        run: npm run build
