# Production VM: SITE_DOMAIN=vmattoo.dev docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    build:
      # Caddy only — the site itself is built in CI and mounted below.
      target: server
      args:
        PUBLIC_SITE_NAME: ${SITE_DOMAIN}
        PUBLIC_WALINE_SERVER_URL: ${PUBLIC_WALINE_SERVER_URL:-https://comments.${SITE_DOMAIN}}
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Release directory written by the GitHub Actions deploy job (as the
      # deploy user, no sudo): releases/<id>/ plus a `current` symlink.
      - ${SITE_WEB_DIR:-/home/vaibhav/personal-website-web}:/web:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to your public hostname, e.g. vmattoo.dev}
      RATE_LIMIT_EVENTS: ${RATE_LIMIT_EVENTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
  waline:
    restart: always

volumes:
  caddy_data:
  caddy_config:
